name: AIRGATE KeepAlive Ping & Emergency Alert

on:
  schedule:
    # Runs every 10 minutes 24/7 from GitHub's servers
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging AIRGATE Backend Health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://airgate-backend.onrender.com/health)
          echo "HTTP Status Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "🚨 CRITICAL ALERT: AIRGATE Backend is DOWN or unreachable! HTTP Code: $HTTP_STATUS"
            exit 1
          fi

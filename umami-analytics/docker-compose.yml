version: '3.8'

services:
  umami-db:
    image: mysql:8.0
    container_name: umami-db
    environment:
      MYSQL_DATABASE: umamirepo
      MYSQL_USER: umamiadmin
      MYSQL_PASSWORD: umamipassword123
      MYSQL_ROOT_PASSWORD: rootpassword123
    volumes:
      - umami-db-data:/var/lib/mysql
    ports:
      - "3307:3306" # Expose MySQL on host port 3307 to avoid conflict with main app port 3306
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:mysql-latest
    container_name: umami
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://umamiadmin:umamipassword123@umami-db:3306/umamirepo
      APP_SECRET: 5d8e9c2b1a3f6c7e8d0a2b4c6e8f0a2b1c3d5e7f
    depends_on:
      umami-db:
        condition: service_healthy
    restart: always

volumes:
  umami-db-data:

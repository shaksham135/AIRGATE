  <!-- Base Portal Bars -->
  <rect x="46" y="74" width="3" height="18" fill="#00f2fe" rx="1" />
  <rect x="71" y="74" width="3" height="18" fill="#00f2fe" rx="1" />

  <!-- Center Bright Portal Light Door -->
  <rect x="54" y="78" width="12" height="14" fill="#00f2fe" rx="2" />

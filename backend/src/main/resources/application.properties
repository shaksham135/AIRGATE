# Application Name
spring.application.name=pyq-platform

# Server Port
server.port=${SERVER_PORT:8080}

# SSL/HTTPS Configuration
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_KEY_ALIAS:tomcat}

# Database Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pyq_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=45000
spring.datasource.hikari.validation-timeout=3000

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-migrate=true
spring.flyway.clean-disabled=false

# JPA/Hibernate Configurations
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jackson.serialization.fail-on-empty-beans=false

# Multipart Upload Configurations (PDF files and diagrams)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# JWT Security Credentials (30 days = 2592000000 ms)
app.jwt.secret=${JWT_SECRET:airgate_production_super_secure_jwt_secret_key_32bytes_minimum_length_2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

# AI Configuration
# Key 1 (primary fallback - PDF ingestion, question classification, AI tutor)
groq.api.key=${GROQ_API_KEY:}
# Key 2 (secondary fallback when key1 rate-limits)
groq.api.key.2=${GROQ_API_KEY_2:}
# Key 3 (tertiary fallback when key2 also rate-limits)
groq.api.key.3=${GROQ_API_KEY_3:}
# Key 4 (fourth fallback)
groq.api.key.4=${GROQ_API_KEY_4:}
# Key 5 (fifth fallback)
groq.api.key.5=${GROQ_API_KEY_5:}
groq.model.heavy=llama-3.3-70b-versatile
groq.model.fast=llama-3.1-8b-instant

# AI Tutor Dynamic Provider Gateway (DEEPSEEK, GROQ, GEMINI, OPENAI)
ai.tutor.provider=${AI_TUTOR_PROVIDER:AUTO}
ai.tutor.api.url=${AI_TUTOR_API_URL:https://api.deepseek.com/v1/chat/completions}
ai.tutor.api.key=${AI_TUTOR_API_KEY:}
ai.tutor.model=${AI_TUTOR_MODEL:deepseek-chat}

# Google Gemini API (Primary for AI Question Gen)
# FREE tier: 1,500 RPD | ~10-15 RPM | Best for GATE-level complex reasoning
# Get your key at: https://aistudio.google.com/apikey
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Google Gemini API - PAID key (Dedicated for AI Tutor chat only - billed per premium user usage)
# Generate a SEPARATE key at: https://aistudio.google.com/apikey
gemini.api.key.tutor=${GEMINI_API_KEY_TUTOR:}

# Directory Config for Asset Uploads
app.upload.dir=uploads

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=pyq-platform

# Rate Limiting Configuration
rate.limit.enabled=${RATE_LIMIT_ENABLED:true}
rate.limit.public-api.requests-per-minute=60
rate.limit.authenticated-api.requests-per-minute=300
rate.limit.upload-api.requests-per-hour=10

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://airgate.vercel.app,https://airgate.in}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=Authorization,Content-Type,Cache-Control
cors.allow-credentials=true

# Frontend URL for redirects & sitemap domain (defaults to localhost:5173 locally, overridable by FRONTEND_URL env var on Vercel)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Scheduling Timezone (IST) — ensures all @Scheduled crons fire in Indian Standard Time
# Without this, Render/cloud servers default to UTC (causing 00:00 crons to fire at 05:30 AM IST)
spring.task.scheduling.pool.size=2
spring.task.scheduling.timezone=Asia/Kolkata

# Database Backup & Vault PIN Configuration
# Disabled by default locally (Windows: mysqldump not in PATH).
# On Linux production (Koyeb/Render), set BACKUP_ENABLED=true via env variable.
backup.enabled=${BACKUP_ENABLED:true}
backup.directory=${BACKUP_DIRECTORY:./backups}
backup.schedule.daily=${BACKUP_SCHEDULE:0 0 2 * * *}
backup.retention.days=${BACKUP_RETENTION_DAYS:7}
admin.backup.pin=${ADMIN_BACKUP_PIN:9988}

# Razorpay Payment Gateway Configuration
# Injected safely via environment variables in production host (e.g. Koyeb/Render)
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Email Notification Gateway Configuration (Brevo / Resend / SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:2525}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.email.from=${APP_EMAIL_FROM:AIRGATE <support@airgate.in>}
brevo.api.key=${BREVO_API_KEY:}
